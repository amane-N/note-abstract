<!DOCTYPE html>
<html lang="ja">
<head><meta charset="UTF-8"><title>有料記事テスト (クラス名バリアント)</title></head>
<body>
  <article>
    <header>
      <h1 class="o-noteContentHeader__title">有料記事のタイトル (クラス名バリアント)</h1>
    </header>
    <div class="note-common-styles__textnote-body">
      <div class="o-noteContentText">
        <p>これは無料部分の本文です。誰でも読むことができます。</p>
        <!-- paywall boundary marker: paidArea クラス名バリアント -->
        <div class="article-paidArea-boundary">購入すると続きが読めます</div>
        <!-- 有料部分 — 絶対に抽出されてはいけない -->
        <p>__PAYWALL_SECRET_TOKEN__ これは有料部分のコンテンツです。</p>
        <p>秘密のクラスバリアントコンテンツです。</p>
      </div>
    </div>
  </article>
</body>
</html>
